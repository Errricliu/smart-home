buildscript {
    repositories {
        maven { url = uri("https://maven.aliyun.com/repository/central") }
        maven { url = uri("https://maven.aliyun.com/repository/public") }
        maven { url = uri("https://repo.spring.io/release") }
        mavenCentral()
    }
    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:3.5.16"
        classpath "io.spring.gradle:dependency-management-plugin:1.1.7"
    }
}

plugins {
    id "java"
}

apply plugin: "org.springframework.boot"
apply plugin: "io.spring.dependency-management"

group = "com.smarthome"
version = "0.0.1-SNAPSHOT"

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web"
    // 表单校验注解（@NotBlank / @Pattern / @PastOrPresent 等）
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    // 密码哈希：只引入 BCrypt，不引入整套 Security 的过滤链
    implementation "org.springframework.security:spring-security-crypto"
    // MySQL 驱动：运行时连 Docker 里的 MySQL（见 docker-compose.yml）
    runtimeOnly "com.mysql:mysql-connector-j"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    // H2 仅用于单元测试（src/test/resources 中覆盖为内存库，测试不依赖 MySQL）
    testRuntimeOnly "com.h2database:h2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
}
