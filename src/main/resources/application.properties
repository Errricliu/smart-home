spring.application.name=smart-home

# 使用 Docker 里的 MySQL（docker-compose.yml 启动），数据落盘持久化，重启不丢
spring.datasource.url=jdbc:mysql://localhost:3306/smart_home?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 让 JPA 根据实体自动建表/更新表结构，开发期很方便
spring.jpa.hibernate.ddl-auto=update
# MySQL 8 默认引擎，建表时带上
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Thymeleaf 模板缓存，开发时关掉方便改页面即时生效
spring.thymeleaf.cache=false

# 头像上传大小上限（超过会抛 MaxUploadSizeExceededException，由 GlobalExceptionHandler 接管）
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
