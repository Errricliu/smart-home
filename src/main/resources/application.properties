spring.application.name=smart-home

# 使用 H2 内存数据库，学习阶段无需单独起 MySQL，重启即清空
spring.datasource.url=jdbc:h2:mem:smarthome;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 让 JPA 根据实体自动建表，开发期很方便
spring.jpa.hibernate.ddl-auto=update

# 每次启动重新建库并插入演示数据（见 DataInitializer）
spring.sql.init.mode=never

# Thymeleaf 模板缓存，开发时关掉方便改页面即时生效
spring.thymeleaf.cache=false

# 头像上传大小上限（超过会抛 MaxUploadSizeExceededException，由 GlobalExceptionHandler 接管）
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
