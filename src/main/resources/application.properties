spring.application.name=smart-home

# 使用 Docker 里的 MySQL（docker-compose.yml 启动），数据落盘持久化，重启不丢
spring.datasource.url=jdbc:mysql://localhost:3306/smart_home?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 让 JPA 根据实体自动建表/更新表结构，开发期很方便
spring.jpa.hibernate.ddl-auto=update
# MySQL 8 默认引擎，建表时带上
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 头像上传大小上限（超过会抛 MaxUploadSizeExceededException，由 GlobalExceptionHandler 接管）
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ===== 并发能力调优（支撑压测）=====
# Tomcat 最大工作线程：默认 200，并发登录时会 ECONNRESET，调到 1000
server.tomcat.threads.max=1000
# 等待队列：请求超过线程数时先排队而不是立刻拒绝
server.tomcat.accept-count=500
# 每个连接最多同时处理的请求数
server.tomcat.max-connections=2000
# 数据库连接池：默认 10 个连接，高并发下会排队等连接，调到 50
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.connection-timeout=30000
