<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Smart Home</title>
    <style>
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            width: 360px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        h1 { margin: 0 0 8px; font-size: 24px; color: #333; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 28px; }
        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 4px;
            outline: none;
        }
        input:focus { border-color: #667eea; }
        input.invalid { border-color: #d33; }
        .field-error { color: #d33; font-size: 13px; margin: 2px 0 12px; }
        .field-spacer { margin-bottom: 14px; }
        button {
            width: 100%;
            padding: 13px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #5568d3; }
        .footer {
            margin-top: 18px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
        }
        .footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>注册账号</h1>
    <div class="subtitle">创建你的 Smart Home 账户</div>

    <form th:action="@{/register}" method="post" th:object="${form}">
        <label for="username">账号</label>
        <input type="text" id="username" th:field="*{username}"
               placeholder="4-20 位字母、数字或下划线"
               th:classappend="${#fields.hasErrors('username')} ? 'invalid'">
        <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        <div class="field-spacer" th:if="${!#fields.hasErrors('username')}"></div>

        <label for="password">密码</label>
        <input type="password" id="password" th:field="*{password}"
               placeholder="6-32 位"
               th:classappend="${#fields.hasErrors('password')} ? 'invalid'">
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        <div class="field-spacer" th:if="${!#fields.hasErrors('password')}"></div>

        <label for="confirmPassword">确认密码</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
               placeholder="再输入一次密码"
               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'invalid'">
        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>

        <button type="submit">注册</button>
    </form>

    <div class="footer">已有账号？<a th:href="@{/login}">去登录</a></div>
</div>
</body>
</html>
