<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Smart Home</title>
    <style>
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            width: 360px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            color: #333;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 18px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #5568d3;
        }
        .error {
            background: #fff0f0;
            color: #d33;
            border: 1px solid #f5c6c6;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 18px;
        }
        .success {
            background: #e8f7ee;
            color: #2e8b57;
            border: 1px solid #b7e4c7;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 18px;
        }
        .footer {
            margin-top: 16px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
        }
        .footer a { color: #667eea; text-decoration: none; }
        .hint {
            margin-top: 18px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Smart Home</h1>
    <div class="subtitle">登录你的智能家居账户</div>

    <div class="success" th:if="${param.registered}">注册成功，请登录</div>

    <div class="error" th:if="${error}">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">账号</label>
        <input type="text" id="username" name="username" placeholder="请输入账号" required>

        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入密码" required>

        <button type="submit">登录</button>
    </form>

    <div class="hint">演示账号：admin / 密码：123456</div>
    <div class="footer">没有账号？<a th:href="@{/register}">注册新账号</a></div>
</div>
</body>
</html>
