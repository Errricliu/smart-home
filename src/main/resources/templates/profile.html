<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - Smart Home</title>
    <style>
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f4f5f7;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }
        .container {
            max-width: 560px;
            margin: 0 auto;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .topbar h1 {
            font-size: 20px;
            margin: 0;
        }
        .logout {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #667eea;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 16px;
        }
        .username {
            font-size: 14px;
            color: #999;
        }
        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin: 16px 0 6px;
        }
        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        input:focus, textarea:focus {
            border-color: #667eea;
        }
        button {
            margin-top: 22px;
            width: 100%;
            padding: 13px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #5568d3;
        }
        .saved {
            background: #e8f7ee;
            color: #2e8b57;
            border: 1px solid #b7e4c7;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 18px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <h1>个人资料</h1>
        <a class="logout" th:href="@{/logout(token=${token})}">退出登录</a>
    </div>

    <div class="card">
        <div class="avatar" th:text="${user.nickname != null and !user.nickname.isEmpty()} ? ${#strings.substring(user.nickname, 0, 1)} : ${#strings.substring(user.username, 0, 1)}"></div>
        <div class="username">账号：<span th:text="${user.username}"></span></div>

        <form th:action="@{/profile}" method="post">
            <label for="nickname">昵称</label>
            <input type="text" id="nickname" name="nickname" th:value="${user.nickname}">

            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" th:value="${user.email}">

            <label for="bio">个人简介</label>
            <textarea id="bio" name="bio" th:text="${user.bio}"></textarea>

            <button type="submit">保存修改</button>
        </form>

        <div class="saved" th:if="${saved}">已保存</div>
    </div>
</div>
</body>
</html>
