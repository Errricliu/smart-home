<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能家居控制中心</title>
    <style>
        :root {
            --bg: #0f1720;
            --panel: #1a2534;
            --panel-2: #212f42;
            --accent: #3b82f6;
            --accent-2: #10b981;
            --danger: #ef4444;
            --text: #e5edf6;
            --text-dim: #8aa0b8;
            --border: #2c3c52;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 20%, #16283c 0%, transparent 50%),
                              radial-gradient(circle at 80% 80%, #12202f 0%, transparent 50%);
        }
        .app {
            width: 100%;
            max-width: 920px;
        }

        /* 顶栏 */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
        }
        .brand .logo {
            width: 34px; height: 34px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .topbar-right { display: flex; align-items: center; gap: 12px; }

        /* 标签导航 */
        .tabs {
            display: flex;
            gap: 6px;
            background: var(--panel);
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all .2s;
        }
        .tab.active { background: var(--panel-2); color: var(--text); font-weight: 600; }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
        }

        /* 表单 */
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 7px; }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 14px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border .2s;
        }
        .form-input:focus, .form-select:focus { border-color: var(--accent); }
        .form-row { display: flex; gap: 14px; }
        .form-row > div { flex: 1; }

        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: opacity .2s, transform .1s;
        }
        .btn:active { transform: scale(.97); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-success { background: var(--accent-2); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-ghost { background: var(--panel-2); color: var(--text-dim); }
        .btn-sm { padding: 7px 14px; font-size: 13px; }
        .btn:hover { opacity: .85; }

        .error-tip { color: #f87171; font-size: 12px; margin-top: 5px; display: none; }

        /* 登录/注册居中卡片 */
        .auth-card { max-width: 430px; margin: 0 auto; }
        .auth-title { text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 26px; }
        .auth-switch { text-align: center; margin-top: 16px; color: var(--text-dim); font-size: 14px; }
        .auth-switch a { color: var(--accent); cursor: pointer; text-decoration: none; }

        /* 资料展示 */
        .info-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid var(--border);
        }
        .info-item:last-child { border-bottom: none; }
        .info-label { color: var(--text-dim); font-size: 14px; }
        .info-value { font-size: 15px; text-align: right; }
        .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--panel-2); display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto 14px; }

        /* 设备网格 */
        .device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
        .device-card {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border .2s;
        }
        .device-card.on { border-color: var(--accent-2); }
        .device-head { display: flex; justify-content: space-between; align-items: center; }
        .device-icon { font-size: 26px; }
        .device-status-dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; }
        .device-card.on .device-status-dot { background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2); }
        .device-name { font-weight: 600; font-size: 15px; }
        .device-meta { font-size: 12px; color: var(--text-dim); }
        .device-actions { display: flex; gap: 6px; margin-top: auto; }
        .device-actions .btn { flex: 1; }

        .empty { text-align: center; color: var(--text-dim); padding: 40px 0; }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; background: var(--panel-2); }
        .badge-admin { background: #7c3aed; color: #fff; }

        /* 用户表格（管理员视图） */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--border); }
        th { color: var(--text-dim); font-weight: 500; }
    </style>
</head>
<body>
    <div class="app">
        <!-- 登录页 -->
        <div id="authView">
            <div class="card auth-card">
                <h2 class="auth-title" id="authTitle">登录智能家居系统</h2>
                <!-- 登录表单 -->
                <div id="loginForm">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" id="loginUid" class="form-input" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" id="loginPwd" class="form-input" placeholder="请输入密码">
                    </div>
                    <div class="error-tip" id="loginErr"></div>
                    <button class="btn btn-primary" id="loginBtn" style="width:100%;margin-top:8px;">登录</button>
                    <div class="auth-switch">还没有账号？<a id="toRegister">立即注册</a></div>
                </div>
                <!-- 注册表单 -->
                <div id="registerForm" style="display:none;">
                    <div class="form-group">
                        <label class="form-label">用户名（4-20位字母/数字/下划线）</label>
                        <input type="text" id="regUid" class="form-input" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码（6-32位）</label>
                        <input type="password" id="regPwd" class="form-input" placeholder="请输入密码">
                    </div>
                    <div class="form-group">
                        <label class="form-label">手机号</label>
                        <input type="text" id="regPhone" class="form-input" placeholder="11位手机号">
                    </div>
                    <div class="error-tip" id="regErr"></div>
                    <button class="btn btn-success" id="regBtn" style="width:100%;margin-top:8px;">注册</button>
                    <div class="auth-switch">已有账号？<a id="toLogin">返回登录</a></div>
                </div>
            </div>
        </div>

        <!-- 主界面 -->
        <div id="mainView" style="display:none;">
            <div class="topbar">
                <div class="brand"><span class="logo">🏠</span> 智能家居控制中心</div>
                <div class="topbar-right">
                    <span id="roleBadge" class="badge"></span>
                    <button class="btn btn-ghost btn-sm" id="logoutBtn">退出登录</button>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="devices">我的设备</button>
                <button class="tab" data-tab="profile">个人资料</button>
                <button class="tab" data-tab="admin" id="adminTab" style="display:none;">用户管理</button>
            </div>

            <!-- 设备页 -->
            <div id="tab-devices" class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
                    <h3 style="font-size:17px;">设备列表</h3>
                    <button class="btn btn-primary btn-sm" id="addDeviceBtn">+ 添加设备</button>
                </div>
                <div class="device-grid" id="deviceGrid"></div>
            </div>

            <!-- 个人资料页 -->
            <div id="tab-profile" class="card" style="display:none;">
                <div class="avatar" id="avatarIcon">👤</div>
                <div id="profileView">
                    <div class="info-item"><span class="info-label">用户ID</span><span class="info-value" id="showId"></span></div>
                    <div class="info-item"><span class="info-label">用户名</span><span class="info-value" id="showUsername"></span></div>
                    <div class="info-item"><span class="info-label">真实姓名</span><span class="info-value" id="showName"></span></div>
                    <div class="info-item"><span class="info-label">性别</span><span class="info-value" id="showGender"></span></div>
                    <div class="info-item"><span class="info-label">年龄</span><span class="info-value" id="showAge"></span></div>
                    <div class="info-item"><span class="info-label">手机号</span><span class="info-value" id="showPhone"></span></div>
                    <div class="info-item"><span class="info-label">邮箱</span><span class="info-value" id="showEmail"></span></div>
                    <div class="info-item"><span class="info-label">简介</span><span class="info-value" id="showBio"></span></div>
                    <div style="margin-top:20px;text-align:right;">
                        <button class="btn btn-primary btn-sm" id="editBtn">编辑资料</button>
                    </div>
                </div>
                <div id="profileEdit" style="display:none;">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">真实姓名</label>
                            <input type="text" id="editName" class="form-input">
                            <div class="error-tip" id="nameError">姓名不能为空</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">性别</label>
                            <select id="editGenderSelect" class="form-select">
                                <option value="MALE">男</option>
                                <option value="FEMALE">女</option>
                                <option value="SECRET">保密</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">生日</label>
                            <input type="date" id="birthDate" class="form-input">
                            <div class="error-tip" id="birthError">请选择有效生日</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">邮箱</label>
                            <input type="text" id="editEmail" class="form-input">
                            <div class="error-tip" id="emailError">邮箱格式不正确</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">简介</label>
                        <input type="text" id="editBio" class="form-input">
                    </div>
                    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;">
                        <button class="btn btn-ghost btn-sm" id="cancelBtn">取消</button>
                        <button class="btn btn-success btn-sm" id="saveBtn">保存</button>
                    </div>
                </div>
            </div>

            <!-- 管理员用户管理页 -->
            <div id="tab-admin" class="card" style="display:none;">
                <h3 style="font-size:17px;margin-bottom:18px;">全平台用户</h3>
                <div style="overflow-x:auto;">
                    <table>
                        <thead><tr><th>ID</th><th>用户名</th><th>姓名</th><th>手机号</th><th>角色</th></tr></thead>
                        <tbody id="adminUserTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加设备弹窗 -->
    <div id="addDeviceModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);justify-content:center;align-items:center;">
        <div class="card" style="width:380px;">
            <h3 style="margin-bottom:18px;">添加设备</h3>
            <div class="form-group">
                <label class="form-label">设备名称</label>
                <input type="text" id="deviceName" class="form-input" placeholder="如：客厅灯">
            </div>
            <div class="form-group">
                <label class="form-label">设备类型</label>
                <select id="deviceType" class="form-select">
                    <option value="LIGHT">灯</option>
                    <option value="AC">空调</option>
                    <option value="TV">电视</option>
                    <option value="CURTAIN">窗帘</option>
                    <option value="SPEAKER">音箱</option>
                    <option value="SENSOR">传感器</option>
                </select>
            </div>
            <div class="error-tip" id="deviceErr"></div>
            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;">
                <button class="btn btn-ghost btn-sm" id="closeDeviceModal">取消</button>
                <button class="btn btn-primary btn-sm" id="confirmAddDevice">确定</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 全局状态 =====
        let currentToken = localStorage.getItem('token') || '';
        let currentRole = localStorage.getItem('role') || '';
        let isAdmin = currentRole === 'ADMIN';

        // ===== 工具：请求封装 =====
        async function api(path, method, body) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(path, opts);
            return res.json();
        }

        // ===== 页面元素 =====
        const authView = document.getElementById('authView');
        const mainView = document.getElementById('mainView');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginErr = document.getElementById('loginErr');
        const regErr = document.getElementById('regErr');
        const deviceGrid = document.getElementById('deviceGrid');
        const roleBadge = document.getElementById('roleBadge');
        const adminTab = document.getElementById('adminTab');
        const adminUserTable = document.getElementById('adminUserTable');
        const addDeviceModal = document.getElementById('addDeviceModal');

        // ===== 登录态恢复（关键：刷新不再掉登录）=====
        function restoreSession() {
            if (!currentToken) return;
            // 有 token 就尝试恢复，验证失败会自动登出
            showMain();
            loadUserInfo();
            loadDevices();
            if (isAdmin) loadAdminUsers();
        }

        function showMain() {
            authView.style.display = 'none';
            mainView.style.display = 'block';
            roleBadge.textContent = isAdmin ? '管理员' : '普通用户';
            roleBadge.className = 'badge' + (isAdmin ? ' badge-admin' : '');
            adminTab.style.display = isAdmin ? 'block' : 'none';
        }

        function logout() {
            currentToken = '';
            currentRole = '';
            isAdmin = false;
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            authView.style.display = 'block';
            mainView.style.display = 'none';
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
        }

        // ===== 认证 =====
        document.getElementById('toRegister').onclick = () => {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            loginErr.style.display = 'none';
            document.getElementById('authTitle').textContent = '注册智能家居账号';
        };
        document.getElementById('toLogin').onclick = () => {
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
            regErr.style.display = 'none';
            document.getElementById('authTitle').textContent = '登录智能家居系统';
        };

        document.getElementById('loginBtn').onclick = async () => {
            const username = document.getElementById('loginUid').value.trim();
            const password = document.getElementById('loginPwd').value.trim();
            if (!username || !password) {
                loginErr.textContent = '用户名和密码不能为空';
                loginErr.style.display = 'block';
                return;
            }
            const data = await api('/api/login', 'POST', { username, password });
            if (!data.success) {
                loginErr.textContent = data.message;
                loginErr.style.display = 'block';
                return;
            }
            currentToken = data.data.token;
            currentRole = data.data.role;
            isAdmin = currentRole === 'ADMIN';
            localStorage.setItem('token', currentToken);
            localStorage.setItem('role', currentRole);
            showMain();
            loadUserInfo();
            loadDevices();
            if (isAdmin) loadAdminUsers();
            document.getElementById('loginPwd').value = '';
        };

        document.getElementById('regBtn').onclick = async () => {
            const username = document.getElementById('regUid').value.trim();
            const password = document.getElementById('regPwd').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const usernameReg = /^[a-zA-Z0-9_]{4,20}$/;
            const phoneReg = /^1[3-9]\d{9}$/;
            if (!usernameReg.test(username)) {
                regErr.textContent = '用户名需4-20位字母/数字/下划线';
                regErr.style.display = 'block'; return;
            }
            if (password.length < 6 || password.length > 32) {
                regErr.textContent = '密码长度需6-32位';
                regErr.style.display = 'block'; return;
            }
            if (!phoneReg.test(phone)) {
                regErr.textContent = '手机号格式不正确';
                regErr.style.display = 'block'; return;
            }
            const data = await api('/api/register', 'POST', { username, password, phone });
            if (!data.success) {
                regErr.textContent = data.message;
                regErr.style.display = 'block';
                return;
            }
            alert('注册成功，请登录');
            document.getElementById('toLogin').click();
            document.getElementById('regUid').value = '';
            document.getElementById('regPwd').value = '';
            document.getElementById('regPhone').value = '';
        };

        // ===== 标签切换 =====
        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                ['devices', 'profile', 'admin'].forEach(name => {
                    document.getElementById('tab-' + name).style.display = 'none';
                });
                document.getElementById('tab-' + tab.dataset.tab).style.display = 'block';
                if (tab.dataset.tab === 'admin') loadAdminUsers();
            };
        });

        // ===== 个人资料 =====
        async function loadUserInfo() {
            const data = await api(`/api/user?token=${currentToken}`, 'GET');
            if (!data.success) {
                if (data.message.includes('未登录')) logout();
                return;
            }
            const u = data.data;
            document.getElementById('showId').textContent = String(u.userId).padStart(6, '0');
            document.getElementById('showUsername').textContent = u.username || '';
            document.getElementById('showName').textContent = u.realName || '';
            document.getElementById('showGender').textContent = u.genderLabel || '';
            document.getElementById('showAge').textContent = u.birthday ? calcAge(u.birthday) : '';
            document.getElementById('showPhone').textContent = u.phone || '';
            document.getElementById('showEmail').textContent = u.email || '';
            document.getElementById('showBio').textContent = u.bio || '';
            document.getElementById('avatarIcon').textContent = '👤';
            if (u.birthday) document.getElementById('birthDate').value = u.birthday;
        }

        function calcAge(birthday) {
            const b = new Date(birthday), n = new Date();
            let age = n.getFullYear() - b.getFullYear();
            const m = n.getMonth() - b.getMonth();
            if (m < 0 || (m === 0 && n.getDate() < b.getDate())) age--;
            return age;
        }

        document.getElementById('editBtn').onclick = () => {
            document.getElementById('editName').value = document.getElementById('showName').textContent;
            document.getElementById('editEmail').value = document.getElementById('showEmail').textContent;
            document.getElementById('editBio').value = document.getElementById('showBio').textContent;
            const g = document.getElementById('showGender').textContent;
            document.getElementById('editGenderSelect').value = (g === '男') ? 'MALE' : (g === '女') ? 'FEMALE' : 'SECRET';
            document.getElementById('profileView').style.display = 'none';
            document.getElementById('profileEdit').style.display = 'block';
        };
        document.getElementById('cancelBtn').onclick = () => {
            document.getElementById('profileView').style.display = 'block';
            document.getElementById('profileEdit').style.display = 'none';
        };
        document.getElementById('saveBtn').onclick = async () => {
            const realName = document.getElementById('editName').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            const birthday = document.getElementById('birthDate').value;
            const emailReg = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
            if (!realName) { document.getElementById('nameError').style.display = 'block'; return; }
            if (!emailReg.test(email)) { document.getElementById('emailError').style.display = 'block'; return; }
            if (!birthday || birthday > new Date().toISOString().split('T')[0]) { document.getElementById('birthError').style.display = 'block'; return; }
            const data = await api('/api/user', 'POST', {
                token: currentToken,
                realName,
                gender: document.getElementById('editGenderSelect').value,
                birthday,
                email,
                bio: document.getElementById('editBio').value.trim()
            });
            if (!data.success) { alert(data.message); return; }
            await loadUserInfo();
            document.getElementById('profileView').style.display = 'block';
            document.getElementById('profileEdit').style.display = 'none';
            alert('保存成功');
        };

        // ===== 设备管理 =====
        const typeIcons = { LIGHT: '💡', AC: '❄️', TV: '📺', CURTAIN: '🪟', SPEAKER: '🔊', SENSOR: '📡' };

        async function loadDevices() {
            const data = await api(`/api/device/list?token=${currentToken}`, 'GET');
            if (!data.success) return;
            const devices = data.data.devices;
            deviceGrid.innerHTML = '';
            if (devices.length === 0) {
                deviceGrid.innerHTML = '<div class="empty">暂无设备，点击右上角「添加设备」开始</div>';
                return;
            }
            devices.forEach(d => {
                const on = d.status === 'ON';
                const card = document.createElement('div');
                card.className = 'device-card' + (on ? ' on' : '');
                card.innerHTML = `
                    <div class="device-head">
                        <span class="device-icon">${typeIcons[d.type] || '🔌'}</span>
                        <span class="device-status-dot"></span>
                    </div>
                    <div class="device-name">${d.name}</div>
                    <div class="device-meta">${d.typeLabel} · ${d.statusLabel}</div>
                    ${d.battery != null ? `<div class="device-meta">电量 ${d.battery}%</div>` : ''}
                    <div class="device-actions">
                        <button class="btn ${on ? 'btn-ghost' : 'btn-success'} btn-sm" onclick="toggleDevice(${d.deviceId})">${on ? '关闭' : '开启'}</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteDevice(${d.deviceId})">删除</button>
                    </div>`;
                deviceGrid.appendChild(card);
            });
        }

        window.toggleDevice = async (id) => {
            const data = await api('/api/device/toggle', 'POST', { token: currentToken, deviceId: id });
            if (!data.success) { alert(data.message); return; }
            loadDevices();
        };
        window.deleteDevice = async (id) => {
            if (!confirm('确定删除该设备？')) return;
            const data = await api('/api/device/delete', 'POST', { token: currentToken, deviceId: id });
            if (!data.success) { alert(data.message); return; }
            loadDevices();
        };

        document.getElementById('addDeviceBtn').onclick = () => {
            addDeviceModal.style.display = 'flex';
        };
        document.getElementById('closeDeviceModal').onclick = () => {
            addDeviceModal.style.display = 'none';
        };
        document.getElementById('confirmAddDevice').onclick = async () => {
            const name = document.getElementById('deviceName').value.trim();
            const type = document.getElementById('deviceType').value;
            if (!name) { document.getElementById('deviceErr').textContent = '设备名不能为空'; document.getElementById('deviceErr').style.display = 'block'; return; }
            const data = await api('/api/device/add', 'POST', { token: currentToken, name, type });
            if (!data.success) { document.getElementById('deviceErr').textContent = data.message; document.getElementById('deviceErr').style.display = 'block'; return; }
            addDeviceModal.style.display = 'none';
            document.getElementById('deviceName').value = '';
            loadDevices();
        };

        // ===== 管理员：用户列表 =====
        async function loadAdminUsers() {
            const data = await api(`/api/admin/users?token=${currentToken}`, 'GET');
            if (!data.success) { alert(data.message); return; }
            adminUserTable.innerHTML = '';
            data.data.users.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${String(u.userId).padStart(6, '0')}</td>
                    <td>${u.username}</td>
                    <td>${u.realName || '-'}</td>
                    <td>${u.phone || '-'}</td>
                    <td>${u.role === 'ADMIN' ? '<span class="badge badge-admin">管理员</span>' : '普通用户'}</td>`;
                adminUserTable.appendChild(tr);
            });
        }

        // ===== 登出 =====
        document.getElementById('logoutBtn').onclick = logout;

        // ===== 启动：优先恢复会话 =====
        restoreSession();
    </script>
</body>
</html>
